name: mcp-server
function: 提供 MCP 配置页与 streamable-http MCP 端点，通过宿主机 Docker 把项目镜像（含简介）构建推送到私有仓库，并可列出、搜索仓库镜像。

input:
  - name: env REGISTRY_ADDRESS
    type: string，形如 host:port
    desc: 推送目标仓库地址，用于给镜像打 tag（docker 由宿主机 daemon 执行，故为主机视角地址）；默认 localhost:20070
  - name: env REGISTRY_API
    type: string，形如 http://host:port
    desc: 本进程访问仓库 HTTP API 的地址（容器内为 host.docker.internal 视角）；默认 http://localhost:20070
  - name: env META_DIR
    type: string，目录路径
    desc: 镜像简介元数据的存储目录，需挂载持久化卷；默认 /data
  - name: HTTP GET /
    type: 无
    desc: 返回 MCP 配置页（HTML）
  - name: HTTP POST /mcp
    type: MCP JSON-RPC（streamable-http，无状态）
    desc: MCP 端点，支持 initialize、tools/list、tools/call、ping
  - name: tool build_and_push
    type: '{project_dir, image, tag, summary, features: string}'
    desc: |
      project_dir 为宿主机上含 Dockerfile 的项目目录绝对路径；image 为仓库内镜像名（可含 / 路径）；tag 为标签。
      summary 为镜像一句话简介，features 为功能说明。调用前须先阅读项目 README、文档与代码自行提炼 summary 与 features，不向用户询问。
  - name: tool list_images
    type: '{}'
    desc: 列出仓库中的镜像、tag 与简介
  - name: tool search_images
    type: '{keyword: string}'
    desc: 按关键字查找镜像，匹配镜像名、简介与功能说明

output:
  - name: 配置页
    type: HTML
    desc: 可填写 MCP 服务网址（默认当前页面地址），实时生成 mcpServers JSON 并一键复制
  - name: build_and_push 结果
    type: '{reference: string, digest: string}'
    desc: reference 为 <REGISTRY_ADDRESS>/<image>:<tag>，digest 为推送返回的 sha256
  - name: list_images 结果
    type: '{repositories: [{name, tags, summary, features}]}'
    desc: 仓库中全部镜像及其 tag；summary/features 为镜像简介与功能说明，未经 MCP 上传的镜像为空字符串
  - name: search_images 结果
    type: '{repositories: [{name, tags, summary, features}]}'
    desc: 名称、简介或功能说明中包含关键字的镜像；无匹配时为空列表
  - name: JSON-RPC 错误
    type: MCP 错误对象
    desc: 参数错误或执行失败时返回，message 含具体原因

contract:
  - GET / 返回 HTML 页面；页面按填写的网址生成 {"mcpServers":{"mcpdock":{"url":"<网址>/mcp"}}}，网址默认取当前页面访问地址，服务端不保存该配置。
  - POST /mcp 对每个 JSON-RPC 请求返回单个 application/json 响应；initialize 协商后可调用 tools/list 与 tools/call。
  - tools/list 返回 build_and_push、list_images 与 search_images 三个工具。
  - build_and_push 依次执行 docker build、docker tag 为 <REGISTRY_ADDRESS>/<image>:<tag>、docker push；成功后返回 reference 与 digest，并按镜像名保存 summary 与 features（覆盖该镜像旧值）。
  - summary 或 features 缺失或为空白时返回参数错误。
  - list_images 返回 REGISTRY_API 中全部 repositories 及各自 tags、summary、features；空仓库返回空列表。
  - search_images 对 list_images 同样的镜像集合做大小写不敏感的子串匹配，keyword 命中 name、summary 或 features 任一字段即返回；keyword 为空白时返回参数错误；无匹配返回空列表。
  - project_dir 不存在、不是目录或目录下无 Dockerfile 时返回 PROJECT_NOT_FOUND。
  - docker build 或 push 失败时分别返回 BUILD_FAILED / PUSH_FAILED，message 含命令输出。
  - REGISTRY_API 不可达时 list_images 或 search_images 返回 REGISTRY_UNAVAILABLE；元数据无法写入时 build_and_push 返回 META_WRITE_FAILED。

errors:
  - code: PROJECT_NOT_FOUND
    desc: project_dir 不存在、不是目录，或目录下没有 Dockerfile
  - code: BUILD_FAILED
    desc: docker build 执行失败
  - code: PUSH_FAILED
    desc: docker push 执行失败
  - code: REGISTRY_UNAVAILABLE
    desc: 无法访问仓库 HTTP API
  - code: META_WRITE_FAILED
    desc: 镜像简介元数据写入 META_DIR 失败

depends: []
modules: []
tests:
  blackbox: tests/test.sh   # 自启临时 registry 与本服务进程，通过 HTTP/JSON-RPC 验证全部输入输出
