services:
  registry:
    image: registry:2
    restart: always
    ports:
      - "${REGISTRY_PORT:-20070}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - "${REGISTRY_DATA_DIR:-./data/registry}:/var/lib/registry"

  ui:
    image: joxit/docker-registry-ui:2
    restart: always
    ports:
      - "${UI_PORT:-20090}:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: MCPDock
      NGINX_PROXY_PASS_URL: http://registry:5000
      NGINX_RESOLVER: 127.0.0.11
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      - registry

  mcp:
    build: ./mcp-server
    restart: always
    ports:
      - "${MCP_PORT:-20080}:8080"
    environment:
      REGISTRY_ADDRESS: localhost:${REGISTRY_PORT:-20070}
      REGISTRY_API: http://host.docker.internal:${REGISTRY_PORT:-20070}
      META_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mcp-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # macOS Docker Desktop 默认共享 /Users；挂到同一路径使容器内外项目路径一致
      - ${HOME}:${HOME}
    depends_on:
      - registry

volumes:
  mcp-data:
